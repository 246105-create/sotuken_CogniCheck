<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3表情識別デモ (ONNX Runtime)</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
    .container { position: relative; display: inline-block; }
    video, canvas { border-radius: 8px; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    #result { font-size: 28px; font-weight: bold; margin-top: 15px; color: #00ff80; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

<h2>ONNX リアルタイム表情判定デモ</h2>
<div class="container">
  <video id="webcam" autoplay playsinline width="640" height="480"></video>
  <canvas id="output_canvas" width="640" height="480"></canvas>
</div>
<div id="result">初期化中...</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

const video = document.getElementById("webcam");
const canvas = document.getElementById("output_canvas");
const ctx = canvas.getContext("2d");
const resultDiv = document.getElementById("result");

let faceLandmarker;
let onnxSession;
let lastVideoTime = -1;

function calcDist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

async function init() {
  resultDiv.innerText = "モデル読み込み中...";

  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1
  });

  try {
    onnxSession = await ort.InferenceSession.create("./expression_model.onnx");
    resultDiv.innerText = "カメラ起動中...";
    startCamera();
  } catch (e) {
    resultDiv.innerText = "エラー: ONNXモデルの読み込みに失敗しました";
    console.error(e);
  }
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  video.addEventListener("loadeddata", predictLoop);
}

async function predictLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const startTimeMs = performance.now();
    const results = faceLandmarker.detectForVideo(video, startTimeMs);

    if (results.faceLandmarks && results.faceLandmarks.length > 0) {
      const lm = results.faceLandmarks[0];

      // メッシュ描画
      ctx.fillStyle = "#00FF80";
      for (const pt of lm) {
        ctx.beginPath();
        ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 1.2, 0, 2 * Math.PI);
        ctx.fill();
      }

      // 特徴量計算＆推論
      const faceWidth = calcDist(lm[33], lm[263]);
      if (faceWidth > 0 && onnxSession) {
        try {
          const f1 = calcDist(lm[13], lm[14]) / calcDist(lm[61], lm[291]);
          const f2 = calcDist(lm[55], lm[285]) / faceWidth;
          const f3 = calcDist(lm[159], lm[145]) / calcDist(lm[33], lm[133]);
          const f4 = calcDist(lm[61], lm[291]) / faceWidth;

          // 入力・出力名を自動割り当て
          const inputName = onnxSession.inputNames[0];
          const outputName = onnxSession.outputNames[0];

          const inputTensor = new ort.Tensor('float32', new Float32Array([f1, f2, f3, f4]), [1, 4]);
          const feeds = {};
          feeds[inputName] = inputTensor;

          const output = await onnxSession.run(feeds);

          // BigInt 型にも対応したラベル取得
          const label = Number(output[outputName].data[0]);

          const expressions = {
            0: "😐 真顔 (Neutral)",
            1: "😊 笑顔 (Smile)",
            2: "😡 怒り (Angry)"
          };

          resultDiv.innerText = `判定: ${expressions[label] || "解析中..."}`;
        } catch (err) {
          console.error("推論詳細エラー:", err);
          resultDiv.innerText = "推論エラー（コンソールを確認してください）";
        }
      }
    } else {
      resultDiv.innerText = "顔が検出されていません";
    }
  }

  requestAnimationFrame(predictLoop);
}

init();
</script>

</body>
</html>
