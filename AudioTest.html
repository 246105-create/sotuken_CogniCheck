<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音声解析ダッシュボード（ログリセット＆描画時間設定対応）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #1a1a1a;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .controls, .save-controls, .settings-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .save-controls, .settings-bar {
      background: #2a2a2a;
      padding: 8px 15px;
      border-radius: 8px;
      max-width: 880px;
      margin: 10px auto 0;
    }
    .dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }
    .panel {
      position: relative;
    }
    .panel-label {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }
    canvas {
      border-radius: 8px;
      background-color: #000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: block;
    }
    #status-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
    }
    #status {
      font-size: 18px;
      font-weight: bold;
      color: #00ff80;
    }
    #vibratoBadge {
      display: none;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff007f, #ff00ff);
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    button, .file-label {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      color: #1a1a1a;
      background-color: #00ff80;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-block;
    }
    button:hover, .file-label:hover {
      opacity: 0.9;
    }
    button:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }
    .btn-reset {
      background-color: #ff4d4d;
      color: #fff;
    }
    input[type="file"] { display: none; }
    input[type="number"] {
      width: 55px;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      text-align: center;
    }
    audio {
      margin-top: 10px;
      width: 400px;
      height: 36px;
    }
  </style>
</head>
<body>

<h2>リアルタイム音声解析ダッシュボード</h2>

<div class="controls">
  <button id="startButton">🎤 マイク起動</button>
  <button id="tabButton" style="background-color: #00e5ff;">📺 YouTube等のタブ音声を解析</button>
  <label class="file-label">📁 音声ファイルを選択
    <input type="file" id="fileInput" accept="audio/*">
  </label>
  <button id="pauseButton" disabled>一時停止</button>
  <button id="resetButton" class="btn-reset">🔄 ログリセット</button>
</div>

<!-- ログ描画時間設定バー -->
<div class="settings-bar">
  <span>⏱️ リアルタイム ログ描画時間:</span>
  <label><input type="number" id="logDurationInput" value="5" min="1" max="60"> 分間</label>
  <span style="font-size: 12px; color: #aaa;">（マイク/タブ音声時のスクロール速度に反映されます）</span>
</div>

<div id="audioPlayerContainer" style="display: none;">
  <audio id="audioElement" controls></audio>
</div>

<div class="save-controls">
  <span>💾 ログ保存範囲:</span>
  <label><input type="number" id="startMin" value="0" min="0">分</label>
  <label><input type="number" id="startSec" value="0" min="0" max="59">秒</label>
  <span>～</span>
  <label><input type="number" id="endMin" value="5" min="0">分</label>
  <label><input type="number" id="endSec" value="0" min="0" max="59">秒</label>
  <button id="saveButton" disabled>指定範囲を画像保存</button>
</div>

<div id="status-container">
  <div id="status">待機中...</div>
  <div id="vibratoBadge">✨ ビブラート検知中</div>
</div>

<div class="dashboard">
  <!-- 1. 波形キャンバス -->
  <div class="panel">
    <div class="panel-label">波形 (Waveform)</div>
    <canvas id="wave_canvas" width="900" height="120"></canvas>
  </div>

  <!-- 2. 周波数スペクトラムキャンバス -->
  <div class="panel">
    <div class="panel-label">周波数スペクトラム (Spectrum: Hz & dB)</div>
    <canvas id="spec_canvas" width="900" height="140"></canvas>
  </div>

  <!-- 3. 周波数ログキャンバス -->
  <div class="panel">
    <div class="panel-label" id="logTitle">周波数ログ (5分間の推移 / 上部ピンク線: ビブラート)</div>
    <canvas id="log_canvas" width="900" height="250"></canvas>
  </div>
</div>

<script>
const waveCanvas = document.getElementById("wave_canvas");
const waveCtx = waveCanvas.getContext("2d");

const specCanvas = document.getElementById("spec_canvas");
const specCtx = specCanvas.getContext("2d");

const logCanvas = document.getElementById("log_canvas");
const logCtx = logCanvas.getContext("2d");

const offscreenLog = document.createElement("canvas");
offscreenLog.width = 900;
offscreenLog.height = 250;
const offCtx = offscreenLog.getContext("2d", { willReadFrequently: true });

const statusDiv = document.getElementById("status");
const vibratoBadge = document.getElementById("vibratoBadge");
const startButton = document.getElementById("startButton");
const tabButton = document.getElementById("tabButton");
const fileInput = document.getElementById("fileInput");
const pauseButton = document.getElementById("pauseButton");
const resetButton = document.getElementById("resetButton");
const saveButton = document.getElementById("saveButton");
const logDurationInput = document.getElementById("logDurationInput");
const audioElement = document.getElementById("audioElement");
const audioPlayerContainer = document.getElementById("audioPlayerContainer");
const logTitle = document.getElementById("logTitle");

let audioContext;
let analyser;
let micStreamSource, tabStreamSource, mediaElementSource;
let timeData, freqData;
let bufferLength;

let currentMode = null; // 'mic', 'tab', 'file'
let isPaused = false;
let fileDuration = 0;

// 描画時間の動的設定変数
let micLogDurationSec = parseInt(logDurationInput.value) * 60; // 初期値 300秒 (5分)
let logIntervalMs = (micLogDurationSec * 1000) / logCanvas.width;
let lastLogTime = 0;

let pitchHistory = [];
const PITCH_HISTORY_MAX = 45;
let isVibratoDetected = false;

function initAudioContext() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    bufferLength = analyser.frequencyBinCount;
    timeData = new Uint8Array(analyser.fftSize);
    freqData = new Uint8Array(bufferLength);

    offCtx.fillStyle = "#000";
    offCtx.fillRect(0, 0, offscreenLog.width, offscreenLog.height);

    requestAnimationFrame(drawLoop);
  }
  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

// 描画時間設定変更イベント
logDurationInput.addEventListener("change", () => {
  let val = parseInt(logDurationInput.value) || 5;
  if (val < 1) val = 1;
  logDurationInput.value = val;

  micLogDurationSec = val * 60;
  logIntervalMs = (micLogDurationSec * 1000) / logCanvas.width;

  if (currentMode === "mic" || currentMode === "tab") {
    logTitle.innerText = `周波数ログ (${val}分間の推移 / 上部ピンク線: ビブラート)`;
    document.getElementById("endMin").value = val;
    resetLog();
  }
});

// リセットボタンイベント
resetButton.addEventListener("click", resetLog);

function resetLog() {
  offCtx.fillStyle = "#000";
  offCtx.fillRect(0, 0, offscreenLog.width, offscreenLog.height);
  logCtx.fillStyle = "#000";
  logCtx.fillRect(0, 0, logCanvas.width, logCanvas.height);
  pitchHistory = [];
  lastLogTime = performance.now();
}

// 1. マイク起動
startButton.addEventListener("click", async () => {
  initAudioContext();
  switchMode("mic");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    analyser.disconnect();

    if (micStreamSource) micStreamSource.disconnect();
    micStreamSource = audioContext.createMediaStreamSource(stream);
    micStreamSource.connect(analyser);

    statusDiv.innerText = "🎤 マイク入力解析中...";
    pauseButton.disabled = false;
    saveButton.disabled = false;
    audioPlayerContainer.style.display = "none";
    logTitle.innerText = `周波数ログ (${logDurationInput.value}分間の推移 / 上部ピンク線: ビブラート)`;

  } catch (e) {
    statusDiv.innerText = "エラー: マイクの取得に失敗しました";
    console.error(e);
  }
});

// 2. YouTube等のタブ音声キャプチャ
tabButton.addEventListener("click", async () => {
  initAudioContext();
  switchMode("tab");

  try {
    const displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false }
    });

    const audioTrack = displayStream.getAudioTracks()[0];
    if (!audioTrack) {
      alert("音声が選択されていません。「タブの音声を共有」にチェックを入れてください。");
      statusDiv.innerText = "エラー: 音声トラックが検出されませんでした";
      return;
    }

    analyser.disconnect();

    if (tabStreamSource) tabStreamSource.disconnect();
    tabStreamSource = audioContext.createMediaStreamSource(new MediaStream([audioTrack]));
    tabStreamSource.connect(analyser);

    statusDiv.innerText = "📺 タブ/画面音声 解析中 (YouTube等)";
    pauseButton.disabled = false;
    saveButton.disabled = false;
    audioPlayerContainer.style.display = "none";
    logTitle.innerText = `周波数ログ (${logDurationInput.value}分間の推移 / 上部ピンク線: ビブラート)`;

    audioTrack.onended = () => {
      statusDiv.innerText = "📺 音声共有が終了しました";
    };

  } catch (e) {
    statusDiv.innerText = "タブ音声の選択がキャンセルされました";
    console.error(e);
  }
});

// 3. ファイル選択
fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  initAudioContext();
  switchMode("file");

  const fileURL = URL.createObjectURL(file);
  audioElement.src = fileURL;
  audioPlayerContainer.style.display = "block";

  audioElement.onloadedmetadata = () => {
    fileDuration = audioElement.duration;
    logTitle.innerText = `周波数ログ (全体: ${formatTime(fileDuration)} / 上部ピンク線: ビブラート)`;

    document.getElementById("startMin").value = 0;
    document.getElementById("startSec").value = 0;
    document.getElementById("endMin").value = Math.floor(fileDuration / 60);
    document.getElementById("endSec").value = Math.floor(fileDuration % 60);
  };

  if (!mediaElementSource) {
    mediaElementSource = audioContext.createMediaElementSource(audioElement);
  }

  mediaElementSource.connect(analyser);
  analyser.connect(audioContext.destination);

  statusDiv.innerText = `📁 ファイル読み込み完了: ${file.name}`;
  pauseButton.disabled = false;
  saveButton.disabled = false;
});

function switchMode(newMode) {
  currentMode = newMode;
  isPaused = false;
  pauseButton.innerText = "一時停止";
  pauseButton.style.backgroundColor = "#00ff80";

  resetLog();

  if (newMode !== "file" && audioElement) {
    audioElement.pause();
  }
}

pauseButton.addEventListener("click", () => {
  isPaused = !isPaused;
  if (isPaused) {
    pauseButton.innerText = "再開";
    pauseButton.style.backgroundColor = "#ffcc00";
    statusDiv.innerText = "⏸ 一時停止中";
    if (currentMode === "file") audioElement.pause();
  } else {
    pauseButton.innerText = "一時停止";
    pauseButton.style.backgroundColor = "#00ff80";
    statusDiv.innerText = "🎤/📺 解析中...";
    if (currentMode === "file") audioElement.play();
  }
});

saveButton.addEventListener("click", saveLogRange);

// ピッチ検出
function autoCorrelate(buffer, sampleRate) {
  let size = buffer.length;
  let rms = 0;
  for (let i = 0; i < size; i++) {
    let val = (buffer[i] - 128) / 128;
    rms += val * val;
  }
  rms = Math.sqrt(rms / size);
  if (rms < 0.03) return -1;

  let r1 = 0, r2 = size - 1, thres = 0.2;
  for (let i = 0; i < size / 2; i++) {
    if (Math.abs((buffer[i] - 128) / 128) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < size / 2; i++) {
    if (Math.abs((buffer[size - i] - 128) / 128) < thres) { r2 = size - i; break; }
  }

  let buf = buffer.slice(r1, r2);
  size = buf.length;

  let c = new Float32Array(size);
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size - i; j++) {
      c[i] = c[i] + ((buf[j] - 128) / 128) * ((buf[j + i] - 128) / 128);
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < size; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  let T0 = maxpos;
  if (T0 <= 0) return -1;

  return sampleRate / T0;
}

// ビブラート分析
function analyzeVibrato() {
  const pitch = autoCorrelate(timeData, audioContext.sampleRate);

  if (pitch > 70 && pitch < 1000) {
    const note = 69 + 12 * Math.log2(pitch / 440);
    pitchHistory.push(note);
  } else {
    pitchHistory.push(null);
  }

  if (pitchHistory.length > PITCH_HISTORY_MAX) {
    pitchHistory.shift();
  }

  const validPitches = pitchHistory.filter(p => p !== null);
  if (validPitches.length < PITCH_HISTORY_MAX * 0.6) {
    isVibratoDetected = false;
    vibratoBadge.style.display = "none";
    return;
  }

  const avgPitch = validPitches.reduce((a, b) => a + b, 0) / validPitches.length;
  const centered = validPitches.map(p => p - avgPitch);

  let zeroCrossings = 0;
  for (let i = 1; i < centered.length; i++) {
    if ((centered[i - 1] < 0 && centered[i] >= 0) || (centered[i - 1] >= 0 && centered[i] < 0)) {
      zeroCrossings++;
    }
  }

  const maxDev = Math.max(...centered);
  const minDev = Math.min(...centered);
  const depth = maxDev - minDev;

  if (zeroCrossings >= 5 && zeroCrossings <= 13 && depth >= 0.35 && depth <= 2.5) {
    isVibratoDetected = true;
    vibratoBadge.style.display = "inline-block";
  } else {
    isVibratoDetected = false;
    vibratoBadge.style.display = "none";
  }
}

function drawLoop(timestamp) {
  requestAnimationFrame(drawLoop);

  if (isPaused) return;

  analyser.getByteTimeDomainData(timeData);
  analyser.getByteFrequencyData(freqData);

  analyzeVibrato();

  drawWaveform();
  drawSpectrum();
  drawSpectrogramLog(timestamp);
}

function drawWaveform() {
  waveCtx.fillStyle = "#000000";
  waveCtx.fillRect(0, 0, waveCanvas.width, waveCanvas.height);

  waveCtx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  waveCtx.beginPath();
  waveCtx.moveTo(0, waveCanvas.height / 2);
  waveCtx.lineTo(waveCanvas.width, waveCanvas.height / 2);
  waveCtx.stroke();

  waveCtx.lineWidth = 2;
  waveCtx.strokeStyle = "#00FF80";
  waveCtx.beginPath();

  const sliceWidth = waveCanvas.width * 1.0 / timeData.length;
  let x = 0;

  for (let i = 0; i < timeData.length; i++) {
    const v = timeData[i] / 128.0;
    const y = v * (waveCanvas.height / 2);

    if (i === 0) waveCtx.moveTo(x, y);
    else waveCtx.lineTo(x, y);

    x += sliceWidth;
  }
  waveCtx.lineTo(waveCanvas.width, waveCanvas.height / 2);
  waveCtx.stroke();
}

function drawSpectrum() {
  specCtx.fillStyle = "#000000";
  specCtx.fillRect(0, 0, specCanvas.width, specCanvas.height);

  const gradient = specCtx.createLinearGradient(0, 0, 0, specCanvas.height);
  gradient.addColorStop(0, "#ff3333");
  gradient.addColorStop(0.5, "#ffff33");
  gradient.addColorStop(1, "#00ff80");
  specCtx.fillStyle = gradient;

  const barWidth = (specCanvas.width / bufferLength) * 1.5;
  let x = 0;

  for (let i = 0; i < bufferLength; i++) {
    const barHeight = (freqData[i] / 255) * specCanvas.height;
    specCtx.fillRect(x, specCanvas.height - barHeight, barWidth, barHeight);
    x += barWidth + 1;
  }

  const nyquist = audioContext.sampleRate / 2;
  specCtx.fillStyle = "rgba(255, 255, 255, 0.6)";
  specCtx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  specCtx.font = "10px sans-serif";

  const hzList = [100, 500, 1000, 5000, 10000, 20000];
  hzList.forEach(hz => {
    if (hz < nyquist) {
      const posX = (hz / nyquist) * specCanvas.width;
      specCtx.beginPath();
      specCtx.moveTo(posX, 0);
      specCtx.lineTo(posX, specCanvas.height);
      specCtx.stroke();
      specCtx.fillText(hz >= 1000 ? `${hz/1000}kHz` : `${hz}Hz`, posX + 2, specCanvas.height - 4);
    }
  });

  const dbList = [-30, -50, -70, -90];
  const minDb = analyser.minDecibels;
  const maxDb = analyser.maxDecibels;

  dbList.forEach(db => {
    const norm = (db - minDb) / (maxDb - minDb);
    const posY = specCanvas.height - (norm * specCanvas.height);
    specCtx.beginPath();
    specCtx.moveTo(0, posY);
    specCtx.lineTo(specCanvas.width, posY);
    specCtx.stroke();
    specCtx.fillText(`${db}dB`, 4, posY - 2);
  });
}

function drawSpectrogramLog(timestamp) {
  if (currentMode === "mic" || currentMode === "tab") {
    if (timestamp - lastLogTime >= logIntervalMs) {
      lastLogTime = timestamp;

      offCtx.drawImage(
        offscreenLog,
        1, 0, offscreenLog.width - 1, offscreenLog.height,
        0, 0, offscreenLog.width - 1, offscreenLog.height
      );

      offCtx.fillStyle = "#000000";
      offCtx.fillRect(offscreenLog.width - 1, 0, 1, offscreenLog.height);

      for (let i = 0; i < bufferLength; i++) {
        const val = freqData[i];
        if (val === 0) continue;
        offCtx.fillStyle = `rgb(${val}, ${Math.max(0, val - 128) * 2}, ${Math.max(0, val - 192) * 4})`;
        const y = offscreenLog.height - ((i / bufferLength) * offscreenLog.height);
        offCtx.fillRect(offscreenLog.width - 1, y - 1, 1, 2);
      }

      if (isVibratoDetected) {
        offCtx.fillStyle = "#ff007f";
        offCtx.fillRect(offscreenLog.width - 1, 0, 1, 8);
      }
    }
  } else if (currentMode === "file" && fileDuration > 0 && !audioElement.paused) {
    const currentPosRatio = audioElement.currentTime / fileDuration;
    const targetX = Math.floor(currentPosRatio * offscreenLog.width);

    offCtx.fillStyle = "#000000";
    offCtx.fillRect(targetX, 0, 2, offscreenLog.height);

    for (let i = 0; i < bufferLength; i++) {
      const val = freqData[i];
      if (val === 0) continue;
      offCtx.fillStyle = `rgb(${val}, ${Math.max(0, val - 128) * 2}, ${Math.max(0, val - 192) * 4})`;
      const y = offscreenLog.height - ((i / bufferLength) * offscreenLog.height);
      offCtx.fillRect(targetX, y - 1, 2, 2);
    }

    if (isVibratoDetected) {
      offCtx.fillStyle = "#ff007f";
      offCtx.fillRect(targetX, 0, 2, 8);
    }
  }

  logCtx.drawImage(offscreenLog, 0, 0);

  const nyquist = audioContext.sampleRate / 2;
  logCtx.fillStyle = "rgba(255, 255, 255, 0.7)";
  logCtx.strokeStyle = "rgba(255, 255, 255, 0.25)";
  logCtx.font = "10px sans-serif";

  const hzList = [1000, 5000, 10000, 20000];
  hzList.forEach(hz => {
    if (hz < nyquist) {
      const posY = logCanvas.height - ((hz / nyquist) * logCanvas.height);
      logCtx.beginPath();
      logCtx.moveTo(0, posY);
      logCtx.lineTo(logCanvas.width, posY);
      logCtx.stroke();
      logCtx.fillText(hz >= 1000 ? `${hz/1000}kHz` : `${hz}Hz`, 4, posY - 2);
    }
  });

  if (currentMode === "mic" || currentMode === "tab") {
    // 描画時間に応じた動的ステップ幅調整
    let stepSec = 30;
    if (micLogDurationSec <= 60) stepSec = 10;
    else if (micLogDurationSec > 600) stepSec = 60;

    for (let offset = 0; offset <= micLogDurationSec; offset += stepSec) {
      const posX = logCanvas.width - (offset / micLogDurationSec) * logCanvas.width;
      logCtx.beginPath();
      logCtx.moveTo(posX, 0);
      logCtx.lineTo(posX, logCanvas.height);
      logCtx.stroke();

      const label = formatRelativeTime(offset);
      let textX = posX - 12;
      if (offset === 0) textX = posX - 25;
      if (offset === micLogDurationSec) textX = posX + 4;
      logCtx.fillText(label, textX, 12);
    }
  } else if (currentMode === "file" && fileDuration > 0) {
    const numTicks = 6;
    for (let i = 0; i <= numTicks; i++) {
      const posX = (i / numTicks) * logCanvas.width;
      const sec = (i / numTicks) * fileDuration;

      logCtx.beginPath();
      logCtx.moveTo(posX, 0);
      logCtx.lineTo(posX, logCanvas.height);
      logCtx.stroke();

      const label = formatTime(sec);
      let textX = posX - 12;
      if (i === 0) textX = posX + 4;
      if (i === numTicks) textX = posX - 30;
      logCtx.fillText(label, textX, 12);
    }

    const playheadX = (audioElement.currentTime / fileDuration) * logCanvas.width;
    logCtx.strokeStyle = "#00ff80";
    logCtx.lineWidth = 1.5;
    logCtx.beginPath();
    logCtx.moveTo(playheadX, 0);
    logCtx.lineTo(playheadX, logCanvas.height);
    logCtx.stroke();
  }
}

function formatRelativeTime(sec) {
  if (sec === 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `-${m}:${s}`;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function saveLogRange() {
  const startM = parseInt(document.getElementById("startMin").value) || 0;
  const startS = parseInt(document.getElementById("startSec").value) || 0;
  const endM = parseInt(document.getElementById("endMin").value) || 0;
  const endS = parseInt(document.getElementById("endSec").value) || 0;

  const reqStartSec = startM * 60 + startS;
  const reqEndSec = endM * 60 + endS;

  if (reqStartSec >= reqEndSec) {
    alert("開始時間は終了時間より前に設定してください。");
    return;
  }

  let xStart = 0, xEnd = logCanvas.width;

  if (currentMode === "file") {
    if (reqEndSec > fileDuration) {
      alert(`指定時間がファイル全体の長さ (${formatTime(fileDuration)}) を超えています。`);
      return;
    }
    xStart = (reqStartSec / fileDuration) * logCanvas.width;
    xEnd = (reqEndSec / fileDuration) * logCanvas.width;
  }

  const cropWidth = xEnd - xStart;
  if (cropWidth <= 0) {
    alert("保存可能な領域がありません。");
    return;
  }

  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = cropWidth;
  exportCanvas.height = logCanvas.height + 30;
  const expCtx = exportCanvas.getContext("2d");

  expCtx.fillStyle = "#1a1a1a";
  expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

  expCtx.drawImage(
    offscreenLog,
    xStart, 0, cropWidth, logCanvas.height,
    0, 0, cropWidth, logCanvas.height
  );

  expCtx.fillStyle = "#00ff80";
  expCtx.font = "12px sans-serif";
  expCtx.fillText(`Audio Log: ${formatTime(reqStartSec)} - ${formatTime(reqEndSec)}`, 10, logCanvas.height + 20);

  const link = document.createElement("a");
  link.download = `spectrogram_${formatTime(reqStartSec).replace(':', 'm')}s_to_${formatTime(reqEndSec).replace(':', 'm')}s.png`;
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
}
